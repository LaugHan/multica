name: Build unsigned iOS IPA

# 在 GitHub 云端编出未签名的 Multica iOS 包（.ipa），下载后用 Sideloadly / 爱思助手
# 用自己的 Apple ID 重签安装到 iPhone。不需要本地装 Xcode，也不需要升级 macOS。
#
# 为什么不用 Xcode 27：Expo SDK 55 / RN 0.83 在 Xcode 27 上有已知硬错误
#   - facebook/react-native#58555（deployment target 变硬错误，resource bundle 挂掉）
#   - expo/expo#51146（Swift 6.4 导致 expo-modules-core 编译失败）
# macos-26 镜像默认 Xcode 26.6，正是这套工程该用的工具链。

on:
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-26
    timeout-minutes: 150

    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 选用 Xcode 26.6，打印环境
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app
          xcodebuild -version
          pod --version
          node --version
          df -h /

      - name: 腾空间（真机包不需要模拟器运行时）
        run: |
          sudo rm -rf /Library/Developer/CoreSimulator/Profiles/Runtimes/* || true
          rm -rf ~/Library/Caches/Homebrew || true
          df -h /

      - name: 安装 pnpm（仓库锁定 10.28.2）
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.2

      - name: 安装 Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 安装依赖（只装移动端，避开桌面端的 Electron 下载）
        run: pnpm install --filter @multica/mobile...

      - name: 生成 iOS 原生工程
        working-directory: apps/mobile
        run: pnpm exec dotenv -e .env.production.local -e .env.production -- cross-env APP_ENV=production expo prebuild -p ios --no-install

      - name: 安装 CocoaPods 依赖（RN 从源码编译，这一步较慢）
        working-directory: apps/mobile/ios
        run: pod install

      - name: 编译（不签名）
        working-directory: apps/mobile/ios
        run: |
          xcodebuild \
            -workspace Multica.xcworkspace \
            -scheme Multica \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: 打包成未签名 .ipa
        working-directory: apps/mobile/ios
        run: |
          rm -rf Payload Multica-unsigned.ipa
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Multica.app Payload/
          zip -qry Multica-unsigned.ipa Payload
          ls -lh Multica-unsigned.ipa
          echo "bundle id:"
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" Payload/Multica.app/Info.plist

      - name: 上传 .ipa
        uses: actions/upload-artifact@v4
        with:
          name: Multica-unsigned-ipa
          path: apps/mobile/ios/Multica-unsigned.ipa
          retention-days: 7
